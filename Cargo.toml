[package]
name = "uptime-forge"
version = "0.2.8"
edition = "2024"
description = "Uptime monitoring service built with Rust"
authors = ["mozart409"]
license = "MIT"
repository = "https://github.com/mozart409/uptime-forge"
homepage = "https://github.com/mozart409/uptime-forge"
readme = "README.md"
keywords = ["uptime", "monitoring", "health-check", "htmx"]
categories = ["web-programming"]
rust-version = "1.96.1"

[dependencies]
axum = "0.8"
axum-prometheus = "0.10"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
dotenvy = "0.15"
futures = "0.3"
hickory-resolver = "0.26"
maud = { version = "0.27", features = ["axum"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = ["migrate", "postgres", "runtime-tokio", "chrono", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "trace",
    "timeout",
    "compression-gzip",
    "catch-panic",
    "request-id",
    "util",
    "fs",]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[build-dependencies]
chrono = "0.4"
